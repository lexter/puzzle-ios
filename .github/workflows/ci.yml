# Integrity review, tests on the newest iOS simulator, and an ad-hoc build to Firebase App
# Distribution. Third-party actions are pinned to commit SHAs; tool downloads are checksum-verified.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SWIFTLINT_VERSION: 0.65.1
  SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0 # portable_swiftlint.zip (macOS)
  MOBSFSCAN_VERSION: 1.1.0
  FIREBASE_TOOLS_VERSION: 15.36.0

jobs:
  integrity:
    name: Code integrity review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false

      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --verbose .

      - name: Privacy guard
        run: scripts/privacy-guard.sh

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Mobile security scan (mobsfscan, OWASP MASVS rules)
        run: |
          python -m pip install --quiet "mobsfscan==${MOBSFSCAN_VERSION}"
          mobsfscan --exit-warning .

  test:
    name: Lint, build and unit test (latest iOS simulator)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Lint (SwiftLint, strict)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --reporter github-actions-logging

      - name: Pick the newest iPhone simulator
        id: simulator
        run: echo "udid=$(scripts/ci/latest-simulator.sh)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Puzzle.xcodeproj \
            -scheme Puzzle \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7

  distribute:
    name: Ad-hoc build to Firebase App Distribution
    needs: [integrity, test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      ADHOC_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROFILE_BASE64 }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_IOS_APP_ID }}
      TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
    steps:
      - name: Check distribution is configured
        id: gate
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=()
          [[ -n "$DIST_CERT_P12_BASE64" ]] || missing+=(IOS_DIST_CERT_P12_BASE64)
          [[ -n "$DIST_CERT_PASSWORD" ]] || missing+=(IOS_DIST_CERT_PASSWORD)
          [[ -n "$ADHOC_PROFILE_BASE64" ]] || missing+=(IOS_ADHOC_PROFILE_BASE64)
          [[ -n "$FIREBASE_SERVICE_ACCOUNT_JSON" ]] || missing+=(FIREBASE_SERVICE_ACCOUNT_JSON)
          [[ -n "$FIREBASE_APP_ID" ]] || missing+=("FIREBASE_IOS_APP_ID (variable)")
          if (( ${#missing[@]} )); then
            echo "::notice title=Distribution skipped::Not configured; missing: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.configured == 'true'
        with:
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        if: steps.gate.outputs.configured == 'true'
        with:
          xcode-version: latest-stable

      - name: Install signing certificate and ad-hoc profile
        if: steps.gate.outputs.configured == 'true'
        id: signing
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          echo "$ADHOC_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"

          security cms -D -i "$RUNNER_TEMP/adhoc.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          uuid=$(read_profile UUID)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/adhoc.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          echo "profile_name=$(read_profile Name)" >> "$GITHUB_OUTPUT"
          echo "team_id=$(read_profile 'TeamIdentifier:0')" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"

      - name: Archive and export ad-hoc IPA
        if: steps.gate.outputs.configured == 'true'
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          bundle_id=$(sed -nE 's/^BUNDLE_ID *= *(.+)$/\1/p' Configuration/Config.xcconfig)
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Configuration/Info.plist

          xcodebuild archive \
            -project Puzzle.xcodeproj \
            -scheme Puzzle \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Puzzle.xcarchive" \
            TEAM_ID="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict><key>${bundle_id}</key><string>${PROFILE_NAME}</string></dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Puzzle.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.gate.outputs.configured == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: "22"

      - name: Upload to Firebase App Distribution
        if: steps.gate.outputs.configured == 'true'
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ipa=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -n 1)
          notes="$REF_NAME@${COMMIT_SHA:0:7}: $(git log -1 --format=%s)"
          npx --yes "firebase-tools@${FIREBASE_TOOLS_VERSION}" appdistribution:distribute "$ipa" \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes "$notes"

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true
